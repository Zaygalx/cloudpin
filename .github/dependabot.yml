version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # init and analyze must run the same version; a PR bumping one fails CodeQL's job.
      codeql-action:
        patterns:
          - github/codeql-action*

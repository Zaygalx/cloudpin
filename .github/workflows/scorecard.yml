name: Scorecard

# OpenSSF Scorecard (github.com/ossf/scorecard-action): rates the repo's security
# practices and publishes the result for the README badge. Weekly, and when
# branch protection changes; actions are pinned by commit, as Scorecard checks.
on:
  schedule:
    - cron: "41 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A fine-grained token with Administration: Read-only on this repository lets
          # Scorecard read branch protection (ossf/scorecard-action docs/authentication/
          # fine-grained-auth-token.md; #54). Until the secret exists, the default token.
          # This workflow never runs on pull requests, so forks never see the secret.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

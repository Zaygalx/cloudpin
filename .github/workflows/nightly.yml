name: Nightly

# Windows (the owner's platform, and where path and shell handling differ) and the
# newest Node, once a day and only when main changed since the last day. Run it by
# hand (with force) before a release. No macOS: it bills at ten times Linux.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main did not change in the last day
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$FORCE" = "true" ] || [ "$age" -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "main unchanged for $age s; skipping."; fi

  # cloudpin.exe embeds its Node (#96), so a newer security release of the
  # pinned Node line may call for a rebuild (the winget design: a patch release
  # only if the fix touches child processes, the file system or TLS). Daily,
  # whether or not main changed; one issue per release. Its own job, the only one
  # that may write issues, and no job needs it: a failure or a stalled
  # nodejs.org here never skips the tests. The script needs no npm install.
  node-security:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node security release for cloudpin.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(node scripts/build-exe.mjs --node-version)"
          newer="$(node scripts/build-exe.mjs --security-release)"
          if [ -z "$newer" ]; then echo "no Node security release newer than $pinned"; exit 0; fi
          title="Node $newer security release: rebuild cloudpin.exe?"
          # Listed first, so a failed list stops the step instead of reading as "no such issue". Closed issues
          # count too: one closed as not needed must not come back every day until the pin moves.
          filed="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json title --jq '.[].title')"
          if printf '%s\n' "$filed" | grep -Fxq -- "$title"; then echo "already filed: $title"; exit 0; fi
          body="$(printf 'nodejs.org/dist/index.json marks Node %s as a security release; cloudpin.exe embeds Node %s (scripts/exe-node-version.txt). Read its release notes: if the fix touches what cloudpin uses (child processes, the file system, TLS to the npm registry), bump the pin and ship a patch release; otherwise bump it for the next minor.' "$newer" "$pinned")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

  test:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 10 for Windows's cloudpin.exe build and checks (#96); Linux stays well under 8.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The runner has bash but not zsh, which the real-shell wrapper tests need (#78).
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh && zsh --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      # The standalone cloudpin.exe (#96), built from this checkout with the pinned
      # Node (its win-x64 node.exe, checked against SHASUMS256.txt, builds itself)
      # and run by its path from Windows PowerShell 5.1: version, refusals, a pin
      # with az absent, arguments cmd.exe would re-parse, and controls that must fail.
      - name: Build cloudpin.exe
        if: runner.os == 'Windows'
        run: node scripts/build-exe.mjs exe-out
      - name: Check cloudpin.exe
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = Get-ChildItem exe-out -Filter 'cloudpin-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no cloudpin-*-win-x64.zip in exe-out' }
          powershell -NoProfile -File scripts/check-exe.ps1 $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

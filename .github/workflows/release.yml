name: Release

# Publishes to npm from GitHub Actions with trusted publishing (OIDC, no stored
# token) and automatic provenance (docs.npmjs.com/trusted-publishers). It only
# stages the version: a maintainer still approves it with 2FA on npmjs.com
# (Staged Packages). Each tag also gets a GitHub Release with the tarball, the
# Windows zip for Scoop, the standalone cloudpin.exe zip for winget, their
# SHA-256 checksums and a signed build-provenance
# attestation (Scorecard Signed-Releases, #53). Triggered by pushing a v* tag;
# run it by hand for a dry run, which also uploads the unsigned files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      # actions/attest-build-provenance (README, permissions).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact version: its bundled npm (11.19.0, nodejs.org/dist/index.json) is
          # new enough, so no unpinned `npm install --global npm` is needed.
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but package.json says $version"; exit 1; fi
      - run: npm ci
      # Build once up front: npm reads package.json before prepublishOnly runs and
      # warns that the bin (dist/cli.js) is missing. It re-reads it after the
      # build, so the published bin was fine (0.2.1), but the warning is noise.
      - run: npm run build
      # Trusted publishing needs npm 11.5.1+, `npm stage` 11.15+.
      - name: Bundled npm is new enough
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error("npm " + process.argv[1] + " is older than 11.15"); process.exit(1) }' "$(npm --version)"
      # npm packs reproducibly: this is byte for byte the file npm will serve
      # (checked against 0.3.1's dist.integrity), so it is the release asset.
      - name: Pack the release tarball
        id: pack
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # The zip the Scoop bucket installs (#17): the tarball's files plus the
      # production node_modules from the lockfile. Built in the dry run too, so
      # a CI-built zip can be tried before a tag.
      - name: Build the Windows zip
        id: zip
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node scripts/windows-zip.mjs "$TARBALL" .
          zip="${TARBALL%.tgz}-windows.zip"
          test -f "$zip"
          sha256sum "$TARBALL" "$zip" > SHA256SUMS
          cat SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # The standalone cloudpin.exe that winget installs (#96): a Node single
      # executable application. The script runs --build-sea with the Node pinned
      # in scripts/exe-node-version.txt, fetching its linux-x64 build and its
      # win-x64 node.exe from nodejs.org/dist and checking each against that
      # release's SHASUMS256.txt and scripts/exe-node-sha256.txt; the job's own
      # Node only bundles.
      - name: Build the standalone exe zip
        id: exe
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node scripts/build-exe.mjs .
          exe="${TARBALL%.tgz}-win-x64.zip"
          test -f "$exe"
          sha256sum "$exe" >> SHA256SUMS
          cat SHA256SUMS
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      # One attestation covering the three files ("May contain a glob pattern or list
      # of paths", the action's subject-path input).
      - name: Sign build provenance
        id: attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.zip.outputs.zip }}
            ${{ steps.exe.outputs.exe }}
      - name: Keep the signed bundle next to the tarball
        if: github.event_name == 'push'
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.tarball }}.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: release-assets
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sigstore.json
            ${{ steps.zip.outputs.zip }}
            ${{ steps.exe.outputs.exe }}
            SHA256SUMS
          if-no-files-found: error
      # The dry run's files, unsigned, for trying the zips with Scoop and winget before a tag.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dry-run-assets
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.zip.outputs.zip }}
            ${{ steps.exe.outputs.exe }}
            SHA256SUMS
          if-no-files-found: error
      # prepublishOnly runs typecheck, tests and build before either command.
      - name: Stage on npm (approve on npmjs.com > Staged Packages)
        if: github.event_name == 'push'
        run: npm stage publish --access public
      # `npm publish --dry-run` refuses a version that is already published, so
      # the dry run runs the same checks and packs without asking the registry.
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: npm run prepublishOnly && npm pack --dry-run && node scripts/release-notes.mjs "$(node -p "require('./package.json').version")"

  # Only this job can write to the repository, and only to create the release.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outside the checkout: the repo's own assets/ (logo, demo) went up with
      # v0.4.0 when the artifact was downloaded there (#65).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
